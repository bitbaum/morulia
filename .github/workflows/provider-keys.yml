name: Provider keys

# The sign-in providers' keys, pasted ONCE as secrets of this repository
# (docs/providers.md has the names and the steps), written into Morulia's env
# on the box. Then the shared sign-in is switched on in every client app as
# soon as Morulia lists a provider. All the logic is loki's:
# .github/workflows/box-env-keys.yml and scripts/hetzner/box-env-keys.sh
# (only these names, a value set in GitHub wins, a missing one deletes nothing,
# names only in the log), then app-secrets.sh signin-on all.
#
# GitHub starts no workflow when a secret changes, so this runs hourly, after
# every deploy, and by hand from the Actions tab.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "23 * * * *"
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  keys:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: bitbaum/loki/.github/workflows/box-env-keys.yml@main
    with:
      app: morulia
      # Every name in lib/upstreams.ts UPSTREAMS[].env, in the same order.
      # test/units.test.ts holds the two lists equal.
      names: >-
        GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET
        APPLE_CLIENT_ID APPLE_TEAM_ID APPLE_KEY_ID APPLE_PRIVATE_KEY
        MICROSOFT_CLIENT_ID MICROSOFT_CLIENT_SECRET
        META_APP_ID META_APP_SECRET
        GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET
        LINKEDIN_CLIENT_ID LINKEDIN_CLIENT_SECRET
        X_CLIENT_ID X_CLIENT_SECRET
        DISCORD_CLIENT_ID DISCORD_CLIENT_SECRET
        GITLAB_CLIENT_ID GITLAB_CLIENT_SECRET
        SLACK_CLIENT_ID SLACK_CLIENT_SECRET
        TWITCH_CLIENT_ID TWITCH_CLIENT_SECRET
        REDDIT_CLIENT_ID REDDIT_CLIENT_SECRET
      signin-on: true
    secrets: inherit
